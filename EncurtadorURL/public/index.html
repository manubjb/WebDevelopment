<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Encurtador de URLs</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <h1>■ Encurtador de URLs</h1>
    <div class="form-row">
        <input id="url" type="url" placeholder="https://exemplo.com/...">
        <button id="btn">Encurtar</button>
    </div>
    <div id="resultado"></div>
    <div class="controls">
        <label for="ordenar">Ordenar por:</label>
        <select id="ordenar">
            <option value="id">Mais recentes</option>
            <option value="acessos">Mais acessadas</option>
        </select>
    </div>
    <h2>URLs cadastradas</h2>
    <table id="tabela">
        <thead>
            <tr>
                <th>Código</th>
                <th>Original</th>
                <th>Acessos</th>
                <th>Criado em</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="app.js"></script>
</body>

</html>
